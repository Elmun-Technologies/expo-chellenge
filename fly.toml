# fly.io konfiguratsiyasi
# 1) fly launch --no-deploy   (birinchi marta app yaratish)
# 2) fly secrets set BOT_TOKEN=... REVIEW_GROUP_ID=... SUPERADMIN_IDS=...
# 3) fly postgres create && fly postgres attach <pg-app>
# 4) fly deploy

app = "expo-challenge-bot"
primary_region = "fra"

[build]

[deploy]
  release_command = "alembic upgrade head"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
