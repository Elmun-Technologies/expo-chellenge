<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kirish — Expo Challenge Admin</title>
<style>
  :root{--bg:#0b0d12;--panel:#12151c;--border:#232836;--text:#e8eaf0;--muted:#8b93a7;--accent:#6d5efc;--red:#ef4444}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);min-height:100vh;display:flex;
       align-items:center;justify-content:center;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif}
  .box{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:32px;width:320px}
  h1{font-size:17px;margin:0 0 4px}
  p{color:var(--muted);margin:0 0 20px;font-size:13px}
  input{width:100%;background:#171b24;border:1px solid var(--border);border-radius:8px;
        color:var(--text);padding:11px 12px;font-size:14px;margin-bottom:14px}
  button{width:100%;background:var(--accent);border:none;border-radius:8px;color:#fff;
         padding:11px;font-size:14px;font-weight:600;cursor:pointer}
  button:hover{opacity:.92}
  .err{background:#ef44441a;color:#fca5a5;border:1px solid #ef444440;border-radius:8px;
       padding:9px 12px;margin-bottom:14px;font-size:13px}
</style>
</head>
<body>
  <form class="box" method="post" action="/admin/login">
    <h1>🎪 Expo Challenge</h1>
    <p>Admin panelga kirish</p>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    <input type="password" name="password" placeholder="Parol" autofocus required>
    <button type="submit">Kirish</button>
  </form>
</body>
</html>
